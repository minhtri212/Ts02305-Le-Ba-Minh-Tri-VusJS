<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Full Height Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        .header { background: #f1c40f; height: 80px; }
        .nav { background: #0d6efd; height: 60px; }
        .sidebar { background: #198754; }
        .main { background: #0dcaf0; }
        .footer { background: #dc3545; height: 80px; }

        .content {
            flex: 1; /* chiếm toàn bộ chiều cao còn lại */
        }
    </style>
</head>
<body class="d-flex flex-column">

    <div class="container-fluid p-0 d-flex flex-column h-100">
        
        <!-- Header -->
        <div class="row g-0">
            <div class="col-12 header d-flex align-items-center ps-3">
                Header
            </div>
        </div>

        <!-- Nav -->
        <div class="row g-0">
            <div class="col-12 nav d-flex align-items-center ps-3 text-white">
                Nav
            </div>
        </div>

        <!-- Content (chiếm toàn bộ chiều cao còn lại) -->
        <div class="row g-0 content">
            <div class="col-3 sidebar d-flex align-items-center justify-content-center text-white">
                Side bar
            </div>
            <div class="col-9 main d-flex align-items-center justify-content-center">
                Main content
            </div>
        </div>

        <!-- Footer -->
        <div class="row g-0">
            <div class="col-12 footer d-flex align-items-center ps-3 text-white">
                Footer
            </div>
        </div>

    </div>

</body>
</html>
